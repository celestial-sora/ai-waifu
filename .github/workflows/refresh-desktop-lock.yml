name: Refresh Desktop Lockfile

on:
  push:
    branches:
      - feature/desktop-pet-local
    paths:
      - "package.json"
      - ".github/workflows/refresh-desktop-lock.yml"
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - ".github/workflows/refresh-desktop-lock.yml"

permissions:
  contents: write

concurrency:
  group: vivian-desktop-lock-refresh-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile to desktop branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh lockfile for patched overrides"
          git push origin HEAD:feature/desktop-pet-local

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: desktop-refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
