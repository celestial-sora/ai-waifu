name: Vivian Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-pet-local
    paths:
      - "app/**"
      - "desktop/**"
      - "lib/**"
      - "public/**"
      - "proxy.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build Next.js standalone server
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build NSIS installer
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify expected installer
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/vivian-socute.exe")) {
            Write-Error "Expected dist/vivian-socute.exe was not produced."
            Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload Vivian installer
        uses: actions/upload-artifact@v4
        with:
          name: vivian-socute-windows-x64
          path: dist/vivian-socute.exe
          if-no-files-found: error
          retention-days: 14
