name: Vivian Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-pet-local
    paths:
      - "app/**"
      - "desktop/**"
      - "lib/**"
      - "public/**"
      - "proxy.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "desktop/**"
      - "lib/**"
      - "public/**"
      - "proxy.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build Next.js standalone server
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Reject bundled environment files
        shell: pwsh
        run: |
          $envFiles = Get-ChildItem ".next/standalone" -Recurse -Force -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like ".env*" -or $_.Extension -eq ".pem" }
          if ($envFiles) {
            $envFiles | ForEach-Object { Write-Error "Sensitive config must not be bundled: $($_.FullName)" }
            exit 1
          }

      - name: Smoke test standalone desktop runtime
        run: node desktop/smoke-standalone.mjs

      - name: Build NSIS installer
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged runtime and installer
        shell: pwsh
        run: |
          $required = @(
            "dist/vivian-socute.exe",
            "dist/win-unpacked/resources/standalone/server.js",
            "dist/win-unpacked/resources/standalone/public/live2d/live2dcubismcore.min.js"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Missing packaged runtime asset: $path"
              exit 1
            }
          }

          $staticFiles = Get-ChildItem "dist/win-unpacked/resources/standalone/.next/static" -Recurse -File -ErrorAction SilentlyContinue
          if (-not $staticFiles) {
            Write-Error "Packaged Next static assets are missing."
            exit 1
          }

          $envFiles = Get-ChildItem "dist/win-unpacked" -Recurse -Force -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like ".env*" -or $_.Extension -eq ".pem" }
          if ($envFiles) {
            $envFiles | ForEach-Object { Write-Error "Sensitive config leaked into packaged app: $($_.FullName)" }
            exit 1
          }

      - name: Upload Vivian installer
        uses: actions/upload-artifact@v4
        with:
          name: vivian-socute-windows-x64
          path: dist/vivian-socute.exe
          if-no-files-found: error
          retention-days: 14
